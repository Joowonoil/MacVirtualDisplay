name: Feature request
description: Suggest a focused improvement for Mac Virtual Display
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the remote-display problem you are trying to solve.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe one concrete change and how it should work.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Target client device
      placeholder: "For example: Galaxy Z Fold8, iPad Pro, or another display"
  - type: textarea
    id: alternatives
    attributes:
      label: Current workaround
      description: Explain how you handle this today, if applicable.
